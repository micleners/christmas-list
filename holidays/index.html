cdbcb9e1a6f","cols":[["Event","Living History Farms Family Christmas"],["Cost / dates","Dec 5, likely paid"],["Link","no link"]]}],"groups":null}]};
const LS_KEY = "holidays-2026-state";
const LS_FILTER = "holidays-2026-go-only";
// Columns shown on the date line, in this order; the rest go under the title.
const WHEN_COLS = ["Date", "Cost / dates", "Where", "Time"];
const DATE_COLS = new Set(["Date", "Time", "Cost / dates"]);

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s)
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
  .replace(/\*([^*]+)\*/g, "<em>$1</em>")
  .replace(/`([^`]+)`/g, "<code>$1</code>");
// "Sat Nov 21, 5-8pm" -> "Sat, Nov. 21, 5–8pm"
const fmtDate = s => s
  .replace(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b(?=\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b)/g, "$1,")
  .replace(/\b(Jan|Feb|Mar|Apr|Aug|Sep|Oct|Nov|Dec)\b(?!\.)/g, "$1.")
  .replace(/(\d|am|pm)-(\d|[A-Z])/g, "$1–$2");

let state = {};
const statusEl = document.getElementById("status");
const setStatus = (t, warn) => { statusEl.textContent = t; statusEl.className = warn ? "warn" : ""; };
const rowsById = Object.fromEntries(DATA.sections.flatMap(s => s.rows.map(r => [r.id, r])));

function readLocal(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function writeLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

async function load() {
  if (!CONFIG.api) { state = readLocal(LS_KEY) || {}; setStatus("saving to this browser only", true); return; }
  try {
    const r = await fetch(CONFIG.api + "/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    for (const u of Object.values(pending)) state[u.id] = { ...(state[u.id] || {}), [u.field]: u.value };
    writeLocal(LS_KEY, state);
    if (!Object.keys(pending).length) setStatus("synced ✓");
  } catch { state = readLocal(LS_KEY) || {}; setStatus("offline: showing this browser's copy", true); }
}

// Saves are queued: taps within ~1s go out as one batch (KV takes one write per second per key),
// and a failed batch retries with backoff until it lands. A newer tap on the same box wins.
const pending = {};
let timer = null, inflight = false, lastSent = 0, attempts = 0;
const qkey = (id, field) => id + "|" + field;

function save(id, field, value) {
  state[id] = { ...(state[id] || {}), [field]: value };
  writeLocal(LS_KEY, state); paint(id); refreshFilter();
  if (!CONFIG.api) return;
  pending[qkey(id, field)] = { id, field, value };
  setStatus("saving…");
  schedule(0);
}

function schedule(delay) {
  if (timer) return;
  timer = setTimeout(flush, Math.max(delay, lastSent + 1100 - Date.now(), 0));
}

async function flush() {
  timer = null;
  if (inflight) return schedule(300);
  const batch = Object.values(pending);
  if (!batch.length) return;
  batch.forEach(u => delete pending[qkey(u.id, u.field)]);
  inflight = true;
  try {
    const r = await fetch(CONFIG.api + "/state", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ updates: batch }),
    });
    if (!r.ok) throw new Error(r.status);
    attempts = 0;
  } catch {
    batch.forEach(u => { pending[qkey(u.id, u.field)] ??= u; });
    attempts++;
  } finally {
    inflight = false; lastSent = Date.now();
  }
  if (Object.keys(pending).length) {
    if (attempts) setStatus("retrying save…", true);
    schedule(attempts ? Math.min(30000, 1000 * 2 ** attempts) : 0);
  } else setStatus("synced ✓");
}
addEventListener("online", () => { if (Object.keys(pending).length) { clearTimeout(timer); timer = null; schedule(0); } });

function paint(id) {
  const el = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!el) return;
  const s = state[id] || {};
  el.classList.toggle("go", !!s.go);
  el.classList.toggle("del", !!s.del);
  el.querySelector('[data-f="go"]').checked = !!s.go;
  el.querySelector('[data-f="del"]').checked = !!s.del;
}
const paintAll = () => { Object.keys(rowsById).forEach(paint); refreshFilter(); };

function renderRow(r) {
  const get = n => (r.cols.find(c => c[0] === n) || [])[1];
  const title = get("Event") || r.cols[0][1];
  const when = WHEN_COLS.map(h => [h, get(h)]).filter(([, v]) => v)
    .map(([h, v], i) => { const t = md(DATE_COLS.has(h) ? fmtDate(v) : v); return i === 0 && h !== "Where" ? `<b>${t}</b>` : t; })
    .join(" · ");
  const meta = r.cols.filter(([h, v]) => v && h !== "Event" && !WHEN_COLS.includes(h)).map(([, v]) => md(v)).join(" · ");
  return `<div class="row" data-id="${esc(r.id)}">
    <div class="body">
      ${when ? `<div class="when">${when}</div>` : ""}
      <div class="title">${md(title)}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ""}
    </div>
    <div class="ticks">
      <label class="tick go"><input type="checkbox" data-f="go" aria-label="Go"><span>Go</span></label>
      <label class="tick del"><input type="checkbox" data-f="del" aria-label="Delete"><span>Del</span></label>
    </div>
  </div>`;
}

function renderSection(s) {
  let inner;
  if (!s.rows.length) inner = `<ul class="gaps">${s.intro.filter(l => l.startsWith("- ")).map(l => `<li>${md(l.slice(2))}</li>`).join("")}</ul>`;
  else if (s.groups) inner = s.groups.map(g => `
    <div class="group hide-empty">
      <h3>${esc(g.label)} <small>${esc(g.sub)}</small></h3>
      <div class="rows">${g.rows.map(id => renderRow(rowsById[id])).join("")}</div>
    </div>`).join("");
  else inner = `<div class="rows">${s.rows.map(renderRow).join("")}</div>`;
  return `<section id="${esc(s.id)}" class="${s.rows.length ? "hide-empty" : ""}"><h2>${esc(s.title)}</h2>${inner}</section>`;
}

// In Go-only mode, hide groups and sections with no Go rows, and the Gaps list.
function refreshFilter() {
  const on = document.body.classList.contains("go-only");
  let any = false;
  document.querySelectorAll(".hide-empty").forEach(el => {
    const has = !!el.querySelector(".row.go");
    el.style.display = on && !has ? "none" : "";
    any ||= has;
  });
  document.querySelectorAll("section:not(.hide-empty)").forEach(el => el.style.display = on ? "none" : "");
  document.getElementById("empty").classList.toggle("show", on && !any);
  const n = Object.values(state).filter(s => s.go && !s.del).length;
  const btn = document.getElementById("goOnly");
  btn.textContent = `★ Go only${n ? ` (${n})` : ""}`;
  btn.setAttribute("aria-pressed", on);
}

function render() {
  document.getElementById("key").innerHTML = md(DATA.key.replace(/^\*\*Status key:\*\*\s*/, ""));
  document.getElementById("nav").innerHTML =
    `<button id="goOnly" type="button" aria-pressed="false">★ Go only</button>` +
    DATA.sections.map(s => `<a href="#${esc(s.id)}">${esc(s.title)}</a>`).join("");
  document.getElementById("app").innerHTML = DATA.sections.map(renderSection).join("");
  document.getElementById("foot").textContent = `Built ${DATA.built} from the wiki. 🎄`;
  document.getElementById("app").addEventListener("change", e => {
    const f = e.target.dataset.f; if (!f) return;
    save(e.target.closest(".row").dataset.id, f, e.target.checked);
  });
  document.getElementById("goOnly").addEventListener("click", () => {
    const on = !document.body.classList.contains("go-only");
    document.body.classList.toggle("go-only", on);
    writeLocal(LS_FILTER, on); refreshFilter();
  });
  if (readLocal(LS_FILTER)) document.body.classList.add("go-only");
}

render();
load().then(paintAll);
// Pick up the other person's ticks when the tab comes back into view.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && CONFIG.api) load().then(paintAll);
});
</script>

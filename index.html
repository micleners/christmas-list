<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Michael's Christmas List 2026</title>
<style>
  :root {
    --bg: #12100f;
    --card: #1d1a19;
    --card-hi: #26221f;
    --line: #342e2a;
    --text: #efe8e1;
    --muted: #a99d93;
    --accent: #d9a15b;
    --accent-2: #8fbf9f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 12px 40px;
  }
  main { max-width: 720px; margin: 0 auto; }
  header { padding: 18px 0 4px; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 6px 0 0; }
  nav {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px;
    scrollbar-width: none; position: sticky; top: 0; background: linear-gradient(var(--bg) 80%, transparent);
    z-index: 2;
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex: none; color: var(--text); text-decoration: none; font-size: .85rem;
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card);
  }
  nav a:active, nav a:hover { border-color: var(--accent); }
  section { margin-top: 16px; scroll-margin-top: 48px; }
  h2 { font-size: 1rem; margin: 0 0 6px; color: var(--accent); }
  .note { color: var(--muted); font-size: .8rem; margin: 0 0 8px; }
  .items { display: grid; gap: 6px; }
  .item {
    display: flex; gap: 10px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 7px 10px; color: inherit; text-decoration: none;
  }
  a.item:hover, a.item:focus-visible { background: var(--card-hi); border-color: var(--accent); outline: none; }
  .thumb {
    flex: none; width: 40px; height: 54px; border-radius: 6px; object-fit: cover;
    background: var(--card-hi); display: grid; place-items: center; font-size: 1.3rem;
  }
  .thumb.icon, .thumb.sq { height: 40px; }
  .body { min-width: 0; flex: 1; }
  .title { font-weight: 600; font-size: .95rem; line-height: 1.3; overflow-wrap: anywhere; }
  .desc { color: var(--muted); font-size: .8rem; line-height: 1.3; margin-top: 1px; overflow-wrap: anywhere; }
  .tag {
    display: inline-block; margin-top: 2px; font-size: .7rem; color: var(--accent-2);
  }
  .arrow { color: var(--muted); flex: none; }
  .bottom { border-top: 1px dashed var(--line); padding-top: 4px; }
  .ribbon {
    display: block; width: 100%; max-width: 320px; height: 14px; margin: 0 auto; padding: 0;
    border: 0; border-radius: 7px; cursor: pointer;
    background: repeating-linear-gradient(-45deg, #b3212f 0 10px, #efe8e1 10px 14px, #2e8a58 14px 24px, #efe8e1 24px 28px);
  }
  .inbox { padding: 40px 0; }
  .ribbon[hidden] { display: none; }
  .ribbon:focus-visible, .tree:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #suggest { margin: 0 auto; max-width: 420px; text-align: center; }
  #suggest form { display: flex; gap: 6px; }
  #suggest input {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px;
  }
  #suggest button.go {
    font: inherit; color: var(--bg); background: var(--accent); border: 0; border-radius: var(--radius);
    padding: 8px 14px; cursor: pointer;
  }
  #suggest button:disabled { opacity: .6; }
  .tree { font-size: 2rem; background: none; border: 0; cursor: pointer; padding: 0; line-height: 1; }
  .err { color: #e85d67; font-size: .8rem; margin: 4px 0 0; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎄 Michael's Christmas List</h1>
    <p class="sub">2026 · tap an item with an arrow to open it</p>
  </header>
  <nav id="nav" aria-label="Groups"></nav>
  <div id="app"></div>
  <div class="inbox">
    <button class="ribbon" id="ribbon" type="button" hidden aria-label="Add an idea"></button>
    <div id="suggest" hidden></div>
  </div>
</main>

<script>
/* CONFIG: edit groups and items here. Page re-renders from this object.
   item = { title, desc?, url?, img?, emoji?, tag? }
   img: preview image (falls back to emoji if it fails to load).
   square: true crops img to a 40x40 square (default is a 40x54 book-cover shape).
   Groups render in order; keep "Decorative tray" last in the last group. */
const CONFIG = {
  groups: [
    {
      id: "books", name: "📚 Books",
      items: [
        {
          title: "Photo books of home",
          desc: "Olympic National rainforest, Bremerton, Silverdale, Seattle, and similar.",
          emoji: "🏔️"
        },
        {
          title: "Align With the Seasons",
          desc: "A 4-part guide to intentional living, from The Twenties Detox.",
          url: "https://www.thetwentiesdetox.com/align-with-the-seasons-guide",
          img: "https://static1.squarespace.com/static/61573406e7fd4849327daade/t/6956db7c537f3f323975c6a1/1758913810568/Align+with+the+Seasons%28cover%29.png?format=500w",
          emoji: "🍂", tag: "thetwentiesdetox.com"
        },
        {
          title: "Llewellyn's Sabbat Essentials Box Set",
          desc: "Box set covering the Wheel of the Year.",
          url: "https://www.amazon.com/dp/0738771694",
          img: "https://m.media-amazon.com/images/I/51oJzDIYs5L._SY445_SX342_ML2_.jpg",
          emoji: "📚", tag: "Amazon"
        },
        {
          title: "Imbolc: Brigid's Feast",
          desc: "The Songs of Sabbats, by Alexandre Ravenhart.",
          url: "https://www.amazon.com/dp/B09QG55XL2",
          img: "https://m.media-amazon.com/images/I/61ykXkWr2EL._SY445_SX342_ML2_.jpg",
          emoji: "📖", tag: "Amazon"
        },
        {
          title: "Seasons of the Witch: Imbolc",
          desc: "112-page guidebook.",
          url: "https://www.amazon.com/dp/1922579785",
          emoji: "📖", tag: "Amazon"
        },
        {
          title: "The Broken Oaths of Aillte",
          desc: "Bridges of Anam, by Elyana Wren.",
          url: "https://www.amazon.com/dp/B0GS8BN2ZS",
          img: "https://m.media-amazon.com/images/I/41iFb9KLyPL._SY445_SX342_ML2_.jpg",
          emoji: "📖", tag: "Amazon"
        }
      ]
    },
    {
      id: "games", name: "🎮 Apps & games",
      items: [
        { title: "Finch subscription", desc: "Self-care pet app, Finch Plus. My friend code: M7VTJF41ZQ", img: "https://finchcare.com/icons/circular-pet-bird-face.svg", square: true, emoji: "🐦" },
        { title: "Minecraft Game Purchase", url: "https://www.minecraft.net/en-us/article/how-gift-minecraft", img: "https://www.minecraft.net/content/dam/minecraftnet/franchise/logos/Homepage_Download-Launcher_Creeper-Logo_500x500.png", square: true, emoji: "⛏️", tag: "Minecraft.net" }
      ]
    },
    {
      id: "snow", name: "❄️ Snow gear",
      items: [
        { title: "Snow pants", desc: "The main ask. Size and style still open.", emoji: "🎿" },
        { title: "Other snow gear", desc: "Jacket, gloves, boots, base layers; open to ideas.", emoji: "🧤" }
      ]
    },
    {
      id: "home", name: "🏡 Home, ritual & decor",
      items: [
        { title: "Bidet for Orchard House", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/BB-1000_Supreme.jpg/330px-BB-1000_Supreme.jpg", square: true, emoji: "🚿" },
        {
          title: "A Good Keychain",
          desc: "From Etsy.",
          url: "https://www.etsy.com/listing/4436863646/wicked-key-chain-i-have-been-changed-for",
          emoji: "🔑", tag: "Etsy"
        },
        {
          title: "Pillar candles",
          desc: "Other candles too. No parfum or fragrance; natural oils and herbs are good.",
          img: "https://upload.wikimedia.org/wikipedia/commons/5/5a/Candle_light%2C_pillar_candle.jpg", square: true,
          emoji: "🕯️"
        },
        {
          title: "Chime Candles",
          url: "https://www.amazon.com/dp/B0DFD1NT9L",
          emoji: "🕯️", tag: "Amazon"
        },
        { title: "Incense", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Combustible_Jasmine_Fragrance_Incense_Sticks.jpg/330px-Combustible_Jasmine_Fragrance_Incense_Sticks.jpg", square: true, emoji: "🪔" },
        {
          title: "Hecate prayer beads",
          url: "https://www.etsy.com/listing/991149504/hecate-hekate-prayer-bead-necklace-in",
          emoji: "📿", tag: "Etsy"
        },
        { title: "Decorative tray", desc: "Style and size still open.", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/Yog%27och_lagan_1.png/330px-Yog%27och_lagan_1.png", square: true, emoji: "🍽️" }
      ]
    }
  ]
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderItem(it) {
  const tag = it.url ? "a" : "div";
  const attrs = it.url ? ` href="${esc(it.url)}" target="_blank" rel="noopener noreferrer"` : "";
  const thumb = it.img
    ? `<img class="thumb${it.square ? " sq" : ""}" src="${esc(it.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-emoji="${esc(it.emoji || "🎁")}">`
    : `<div class="thumb icon" aria-hidden="true">${esc(it.emoji || "🎁")}</div>`;
  return `<${tag} class="item"${attrs}>
    ${thumb}
    <div class="body">
      <div class="title">${esc(it.title)}</div>
      ${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ""}
      ${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ""}
    </div>
    ${it.url ? `<span class="arrow" aria-hidden="true">↗</span>` : ""}
  </${tag}>`;
}

document.getElementById("nav").innerHTML = CONFIG.groups
  .map(g => `<a href="#${g.id}">${esc(g.name)}</a>`).join("");

document.getElementById("app").innerHTML = CONFIG.groups.map(g => `
  <section id="${g.id}" class="${g.bottom ? "bottom" : ""}">
    <h2>${esc(g.name)}</h2>
    ${g.note ? `<p class="note">${esc(g.note)}</p>` : ""}
    <div class="items">${g.items.map(renderItem).join("")}</div>
  </section>`).join("");

// Swap a broken preview image for its emoji.
document.querySelectorAll("img.thumb").forEach(img => {
  img.addEventListener("error", () => {
    const d = document.createElement("div");
    d.className = "thumb icon";
    d.textContent = img.dataset.emoji;
    img.replaceWith(d);
  });
});

/* Suggestion box. The ribbon appears only when the link carried #k=<key> (kept in localStorage
   after the first visit). Submissions go to the list-inbox Worker; Michael pulls them by hand. */
const INBOX_API = "https://list-inbox.micleners.workers.dev";
let inboxKey = "";
try {
  inboxKey = new URLSearchParams(location.hash.slice(1)).get("k") || "";
  if (inboxKey) localStorage.setItem("listInboxKey", inboxKey);
  else inboxKey = localStorage.getItem("listInboxKey") || "";
} catch {}

if (inboxKey) {
  const ribbon = document.getElementById("ribbon"), box = document.getElementById("suggest");
  ribbon.hidden = false;
  const showForm = () => {
    box.innerHTML = `<form><input name="t" maxlength="500" placeholder="Idea, with a link if you have one" aria-label="Idea" autocomplete="off" required>
      <button class="go" type="submit">Submit</button></form><p class="err" id="err" hidden></p>`;
    const form = box.querySelector("form"), input = form.t, btn = form.querySelector("button");
    input.focus();
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      btn.disabled = true;
      try {
        const r = await fetch(INBOX_API + "/add", {
          method: "POST", headers: { "content-type": "application/json", "x-key": inboxKey },
          body: JSON.stringify({ text }),
        });
        if (!r.ok) throw new Error(r.status);
        box.innerHTML = `<button class="tree" type="button" aria-label="Added. Tap to add another">🎄</button><p class="note">Added</p>`;
        box.querySelector(".tree").addEventListener("click", showForm);
      } catch {
        btn.disabled = false;
        const err = document.getElementById("err");
        err.textContent = "Didn't save. Try again?"; err.hidden = false;
      }
    });
  };
  // The ribbon opens the box once and stays gone until a refresh; the tree reopens the field.
  ribbon.addEventListener("click", () => {
    ribbon.hidden = true;
    box.hidden = false;
    showForm();
  });
}
</script>
</body>
</html>
